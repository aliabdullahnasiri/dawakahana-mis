<table
  class="table align-items-center mb-0 table-hover"
  data-type="dynamic"
  data-get-rows="{{ url_for('api.fetch_invoice_rows') }}"
  data-get-row="{{ url_for('api.fetch_invoice_row', id=-1) }}"
  data-update-row="{{ url_for('api.update_invoice') }}"
  data-delete-row="{{ url_for('api.delete_invoice', id=-1) }}"
  data-view-row="{{ url_for('admin.view', entity='invoice', id=-1) }}"
  data-add-row-modal-id="#AddInvoiceModal"
  data-edit-row-modal-id="#EditInvoiceModal"
  data-view-row-modal-id="#ViewModal"
>
  <thead></thead>

  <tbody></tbody>
</table>
