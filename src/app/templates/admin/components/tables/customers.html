<table
  class="table align-items-center mb-0 table-hover"
  data-type="dynamic"
  data-get-rows="{{ url_for('api.fetch_customer_rows') }}"
  data-get-row="{{ url_for('api.fetch_customer_row', id=-1) }}"
  data-update-row="{{ url_for('api.update_customer') }}"
  data-delete-row="{{ url_for('api.delete_customer', id=-1) }}"
  data-view-row="{{ url_for('admin.view', entity='customer', id=-1) }}"
  data-add-row-modal-id="#AddCustomerModal"
  data-edit-row-modal-id="#EditCustomerModal"
  data-view-row-modal-id="#ViewModal"
>
  <thead></thead>

  <tbody></tbody>
</table>
