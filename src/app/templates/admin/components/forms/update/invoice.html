{% with f = form.u %}

<form
  autocomplete="off"
  method="POST"
  action="{{ url_for('api.update_invoice') }}"
  data-get="{{ url_for('api.fetch_invoice', id=-1) }}"
>
  {{ f.hidden_tag() }}

  <div class="row my-3">
    <div class="text-center">
      {{ f.submit( class="btn bg-gradient-info btn-lg w-100 mt-4 mb-0" ) }}
    </div>
  </div>
</form>

{% endwith %}
