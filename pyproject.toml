[project]
name = "app"
version = "0.1.0"
description = "Modern pharmacy management platform for inventory, sales, billing, expiry tracking, and financial management."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "flask-bcrypt>=1.0.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gevent>=26.8.0",
    "gunicorn>=26.0.0",
    "humanize>=4.16.0",
    "jdatetime>=6.1.0",
    "numerize>=0.12",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "werkzeug>=3.1.8",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
